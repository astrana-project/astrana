# Checks every pull request, and every push to develop, master and support branches. It never signs or publishes
# anything.
name: CI

on:
  pull_request:
  push:
    branches: [develop, master, "support/**"]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - name: Tests of the check scripts
        shell: pwsh
        run: |
          ./tools/scripts/Install-Pester.ps1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tools/test'
          $configuration.Run.Exit = $true
          Invoke-Pester -Configuration $configuration
      - name: Licence lines
        shell: pwsh
        run: ./tools/scripts/Test-LicenceLines.ps1
      - name: Documentation style
        shell: pwsh
        run: ./tools/scripts/Test-DocumentationStyle.ps1
      - name: Sign-off on every commit
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./tools/scripts/Test-SignOff.ps1 -Base $env:BASE_SHA -Head $env:HEAD_SHA
      - name: Changelog entry
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./tools/scripts/Test-Changelog.ps1 -Base $env:BASE_SHA -Head $env:HEAD_SHA -BaseBranch $env:BASE_REF

  source:
    name: Pull request source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Branches allowed into master
        shell: pwsh
        run: >-
          ./tools/scripts/Test-PullRequestSource.ps1 -Base $env:BASE_REF -Head $env:HEAD_REF -HeadRepository
          $env:HEAD_REPOSITORY -BaseRepository $env:GITHUB_REPOSITORY
      - name: Housekeeping changes documentation only
        shell: pwsh
        run: ./tools/scripts/Test-HousekeepingChanges.ps1 -Branch $env:HEAD_REF -Base $env:BASE_SHA -Head $env:HEAD_SHA

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks, checked against its published checksum
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto "=https" --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
      - run: ./gitleaks git --redact --verbose .

  dotnet:
    name: .NET ${{ matrix.solution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - application/backend/Astrana.slnx
          - owner-tools/Astrana.OwnerTools.slnx
          - shared/Astrana.Shared.slnx
    env:
      ContinuousIntegrationBuild: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore ${{ matrix.solution }}
      - run: dotnet format ${{ matrix.solution }} --verify-no-changes --no-restore
      - run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release
      # Exit code 8 means no tests ran. Remove --ignore-exit-code 8 once every solution has tests.
      - run: dotnet test --solution ${{ matrix.solution }} --no-build --configuration Release --ignore-exit-code 8

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: No shipped package with a known high or critical vulnerability
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
